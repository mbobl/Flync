name: flync
description: "A flutter file synchronization app."
publish_to: "none"
version: 0.1.0

environment:
  # Language version pinned to 3.12: stable freezed (3.2.5) still generates
  # `final` constructor params, which the 3.13 grammar rejects. Bump to ^3.13.0
  # together with freezed 4.0.0 stable.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_size_text: ^3.0.0
  dartx: ^1.2.0
  device_preview: ^1.2.0
  ellipsized_text: ^2.0.0
  file_picker: ^12.0.0
  freezed_annotation: ^3.1.0
  ftpconnect: ^2.0.7
  google_fonts: ^8.2.1
  gradient_borders: ^1.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  intl: ^0.20.3
  humanizer: ^3.0.0
  material_symbols_icons: ^4.2811.0
  animations: ^2.0.11
  go_router: ^17.5.0
  get_it: ^9.2.1
  dynamic_system_colors: ^1.8.0 #https://github.com/material-foundation/flutter-packages/issues/574#issuecomment-2636066025
  flutter_form_builder: ^10.3.0 # 11.x moved to the standalone material_ui package; upgrade together with the app-wide material_ui migration (SDK Material deprecates ~Nov 2026)
  form_builder_validators: ^11.1.2
  flutter_slidable: ^4.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
